<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAP's Menu - 2024</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-stone-50 text-stone-800">
    <!-- Header will be loaded dynamically -->
    
    <main class="container mx-auto px-4">
        <section class="py-8">
            <h1 class="text-4xl font-bold text-brand-red mb-6">Our Menu</h1>
            
            <div class="bg-white rounded-lg shadow-lg p-4">
                <!-- PDF Viewer -->
                <div class="relative w-full" style="height: 800px;">
                    <iframe 
                        src="/pdf/CAPs-Menu-2024.pdf" 
                        class="w-full h-full"
                        style="border: none;">
                    </iframe>
                </div>
                
                <!-- Fallback Download Link -->
                <div class="mt-4 text-center">
                    <p class="mb-2">Having trouble viewing the menu?</p>
                    <a 
                        href="/pdf/CAPs-Menu-2024.pdf" 
                        download 
                        class="inline-block px-6 py-2 bg-brand-red text-white rounded hover:bg-red-800 transition-colors">
                        Download Menu (PDF)
                    </a>
                </div>
            </div>
        </section>
        
        <!-- Visit Us Section Placeholder -->
        <div id="visit-us-section"></div>
    </main>

    <!-- Include your footer here -->
    
    <script src="script.js"></script>
</body>
</html>
